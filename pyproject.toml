[project]
name = "auto-report-agent"
version = "0.2.0"
description = "A CrewAI project for research, writing, review, and literature-analysis report generation."
readme = "README.md"
authors = [
    { name = "Z_jl" }
]
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
keywords = ["crewai", "agent", "streamlit", "openai-compatible", "report-generation"]
dependencies = [
    "crewai>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "reportlab>=4.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "openai>=1.66.0,<3.0.0"
]

[project.scripts]
auto-report-agent = "auto_report_agent.main:run"

[project.urls]
Homepage = "https://github.com/Z-jla/auto_report_agent"
Repository = "https://github.com/Z-jla/auto_report_agent"
Issues = "https://github.com/Z-jla/auto_report_agent/issues"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_report_agent"]

[project.optional-dependencies]
dev = [
    "build>=1.2.0,<2.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]
security = [
    "pip-audit>=2.9.0,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# UP keeps typing imports current. SIM and RET are deliberately off: SIM105
# would put a contextlib.suppress inside per-file stat loops, which is slower
# than a try/except that costs nothing when it does not fire, and SIM108/RET504
# would replace clearer blocks with a dense ternary and break the re.sub chain
# in pdf_export._inline.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repository root on sys.path so tests can import the Streamlit
# entrypoint (app.py), which lives outside the installed package.
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.10"
files = ["src/auto_report_agent", "app.py"]
# Third-party packages here (crewai, streamlit, litellm) ship incomplete or
# absent stubs, so imports are checked structurally rather than against them.
ignore_missing_imports = true
warn_unused_ignores = true
# crew.py is excluded because CrewAI's @CrewBase/@agent/@task decorators return
# descriptors mypy cannot model: it reports "missing positional argument self"
# for every decorated call. Those 53 errors are all artifacts of the framework,
# not of this code, and suppressing them individually would hide real ones.
exclude = "src/auto_report_agent/crew\\.py"
