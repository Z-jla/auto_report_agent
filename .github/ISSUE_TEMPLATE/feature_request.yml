name: Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在遇到了什么不便？或者希望用这个项目完成什么？
      placeholder: 现在只能一次处理单篇文献，我希望支持一次上传多篇做横向对比……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望以什么方式解决？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否尝试过别的方案？为什么不够好？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 其他说明
      description: 使用场景、参考实现、截图等。
    validations:
      required: false
