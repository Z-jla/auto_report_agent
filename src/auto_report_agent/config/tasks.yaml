research_task:
  # 不要在这里写死搜索工具：工具只有在 Responses API + 联网搜索都启用时才会挂到
  # researcher 上，是否可用由 crew.py 决定，检索方式那一段也由它按实际情况追加。
  description: >
    围绕主题「{topic}」进行系统性资料研究。
    必须严格遵循以下要求：
    1. 覆盖截至报告生成时的最新信息，重点关注最近三年的进展
    2. 优先级顺序：政府报告/学术论文/上市公司官方 > 权威媒体/智库 > 行业报告 > 普通文章
    3. 总结核心趋势、提取关键数据、观点和真实案例
    4. 每条信息必须标注：来源标题、发布时间、URL、可信度评级（高/中/低）
    5. 主动标注信息冲突点或争议观点
    6. 输出结构化研究笔记
  expected_output: >
    一份 Markdown 格式的结构化研究笔记，必须包含以下小节：
    - 核心发现（Top 5-8 条）
    - 趋势分析
    - 重要数据与案例
    - 来源清单（含标题、URL、可信度）
    - 可直接用于写作的事实依据
  agent: researcher

writing_task:
  description: >
    根据 research_task 的结构化研究结果，撰写一篇专业中文深度报告。
    报告主题：「{topic}」
    目标读者：大学生、求职者、技术从业者
    写作要求：
    1. 严格按照以下结构撰写：执行摘要、背景与现状、核心分析（分维度）、趋势与展望、结论与建议
    2. 所有观点必须有数据或来源支撑
    3. 多给出具体、可落地的建议，避免空泛表达
    4. 保留必要引用（格式：作者/机构 + 年份 + 链接）
    5. 语言专业、流畅，适合中文读者
  expected_output: >
    一篇 1800-2500 字的中文专业报告（Markdown 格式），包含：
    - 标题
    - 执行摘要
    - 正文（按 5 段结构）
    - 结论与建议
    - 参考来源列表
  agent: writer
  context:
    - research_task

review_task:
  description: >
    对 writing_task 生成的报告进行全面专业审核。
    必须逐项检查以下内容：
    1. 是否偏离主题 {topic}
    2. 所有事实和数据是否有可靠来源支撑（无来源内容必须删除或标注“待核实”）
    3. 结构是否清晰完整（是否符合 5 段式）
    4. 是否存在空泛表达或缺乏依据的结论
    5. 引用是否规范、完整
    6. 逻辑是否严密，是否存在自相矛盾
    7. 语言是否专业、流畅，适合目标读者
    审核完成后，请直接输出优化后的最终版本，并附上简要《修改说明》。
  expected_output: >
    一篇经过严格审核、润色和结构优化的最终 Markdown 报告（可直接交付）。
    同时输出一份简短的《修改说明》（列出主要修改点）。
  agent: reviewer
  context:
    - research_task
    - writing_task
  output_file: "{output_file}"
  create_directory: true

paper_analysis_task:
  description: >
    请基于用户上传的文献内容，完成结构化文献分析。
    文献分析主题：「{topic}」
    用户补充要求：「{paper_instruction}」

    以下是已解析出的文献内容：
    {paper_context}

    请严格执行：
    1. 对每篇文献分别提取：标题/主题、研究问题、方法、实验设计或数据、核心结果、创新点、局限性
    2. 如果文献中缺少某项信息，请明确标注“文中未明确说明”
    3. 如果上传了多篇文献，请补充跨文献对比：研究方向、方法差异、结果差异、共同问题、研究空白
    4. 全程只能基于上传文献内容分析，不得编造文献中不存在的信息
    5. 输出应适合后续直接写成中文综述或分析报告
  expected_output: >
    一份 Markdown 格式的结构化文献分析结果，必须包含：
    - 文献总体概览
    - 每篇文献的结构化摘要
    - 多篇文献对比（如适用）
    - 综合结论
    - 可直接用于写作的关键事实依据
  agent: paper_analyst

paper_writing_task:
  description: >
    根据 paper_analysis_task 的结构化文献分析结果，撰写一篇专业中文文献综述/分析报告。
    报告主题：「{topic}」
    用户补充要求：「{paper_instruction}」
    目标读者：大学生、求职者、技术从业者

    写作要求：
    1. 严格按照以下结构撰写：执行摘要、文献背景、单篇核心内容、跨文献对比分析、结论与启示
    2. 所有结论必须来源于上传文献，不得凭空补充
    3. 如果文献数量较多，优先提炼共性、差异和代表性观点
    4. 语言专业、流畅，适合中文读者
    5. 保留必要的文献引用标记（至少写明文献序号/标题）
  expected_output: >
    一篇 1800-2800 字的中文文献综述/分析报告（Markdown 格式），包含：
    - 标题
    - 执行摘要
    - 正文（按 5 段结构）
    - 结论与启示
    - 文献引用列表
  agent: writer
  context:
    - paper_analysis_task

paper_review_task:
  description: >
    对 paper_writing_task 生成的文献综述/分析报告进行全面审核。
    必须逐项检查以下内容：
    1. 是否偏离主题 {topic}
    2. 所有结论是否确实来自上传文献（无依据内容必须删除或标注“待核实”）
    3. 是否准确区分“文献原文事实”和“综合分析判断”
    4. 结构是否清晰完整
    5. 是否存在空泛表达或无依据结论
    6. 引用是否规范、完整
    7. 语言是否专业、流畅，适合目标读者

    审核完成后，请直接输出优化后的最终版本，并附上简要《修改说明》。
  expected_output: >
    一篇经过严格审核、润色和结构优化的最终 Markdown 文献分析报告（可直接交付）。
    同时输出一份简短的《修改说明》。
  agent: reviewer
  context:
    - paper_analysis_task
    - paper_writing_task
  output_file: "{output_file}"
  create_directory: true

paper_direct_writing_task:
  description: >
    根据系统已经完成的“分阶段文献综合材料”，直接撰写一篇专业中文精读/综述报告。
    报告主题：「{topic}」
    用户补充要求：「{paper_instruction}」

    以下是分阶段阅读后压缩得到的文献材料：
    {paper_context}

    写作要求：
    1. 只把上传文献和分阶段材料中明确出现的信息写成“文献原文事实”
    2. 对用户要求中的“创新点/启示/对比”可以做综合分析，但必须明确标注为“综合分析判断”
    3. 如果用户要求“结合国内外最新研究”，而材料中没有外部最新研究来源，请明确写“当前未联网补充，以下为基于上传文献的判断”
    4. 控制篇幅，优先输出高密度内容，避免空泛铺陈
    5. 保留文献引用标记（文件名/文献序号/标题）
  expected_output: >
    一篇 1200-2000 字的中文 Markdown 精读/综述报告，必须包含：
    - 标题
    - 执行摘要
    - 文献精读：研究问题、方法、实验/数据、核心结论
    - 创新点与局限性
    - 综合分析判断与启示
    - 参考文献/依据
    - 待核实或材料不足之处
  agent: writer
  output_file: "{output_file}"
  create_directory: true

paper_direct_review_task:
  description: >
    对 paper_direct_writing_task 生成的文献精读/综述报告做轻量审核与润色。
    目标是减少长时间调用：不要重新大幅扩写，不要引入新事实，只做必要纠错、压缩和结构优化。

    必须检查：
    1. 是否偏离主题 {topic}
    2. 是否把“文献原文事实”和“综合分析判断”区分清楚
    3. 是否存在无依据结论；无依据内容应删除或标注“待核实”
    4. 引用标记是否保留
    5. 语言是否专业、流畅

    审核完成后输出优化后的完整报告，并附 3-5 条简短《修改说明》。
  expected_output: >
    一篇经过轻量审核的最终 Markdown 文献分析报告，建议控制在 1200-2000 字。
    同时输出简短《修改说明》。
  agent: reviewer
  context:
    - paper_direct_writing_task
  output_file: "{output_file}"
  create_directory: true
